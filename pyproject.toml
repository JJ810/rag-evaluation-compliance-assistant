[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-evaluation-compliance-assistant"
version = "0.1.0"
description = "Local-first Enterprise RAG evaluation and compliance assistant portfolio project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Braulio Gael Porras Zuniga" }
]
keywords = ["rag", "llm", "evaluation", "guardrails", "fastapi", "streamlit"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "openai>=1.90.0",
  "streamlit>=1.37.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pre-commit>=3.7.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.urls]
Repository = "https://github.com/example/enterprise-rag-evaluation-compliance-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=rag_compliance_assistant --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["reports/"]

[[tool.mypy.overrides]]
module = ["streamlit", "requests"]
ignore_missing_imports = true
